<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCMS Documents</title>
<style>
  :root { --bg: #f7f7f8; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --border: #d9d9de; --accent: #2457c5; --ok: #1a7f37; --bad: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --card: #222226; --text: #ececf0; --muted: #a0a0a8; --border: #3a3a40; --accent: #7aa2ff; --ok: #4cc26b; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  label { display: block; margin-top: 10px; }
  button { margin-top: 12px; margin-right: 8px; padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; max-height: 480px; overflow: auto; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>CCMS Documents</h1>
  <div class="muted">Health: <span id="health">checking…</span> · <a href="swagger">Swagger</a></div>

  <div class="card">
    <h2>Upload documents</h2>
    <div class="muted">One or more PDF or image files, read together as one document.</div>
    <label>Files <input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.jfif,.png,.bmp,.tif,.tiff,.webp"></label>
    <label><input id="includeText" type="checkbox"> Also return the OCR text</label>
    <button id="process">OCR + run task</button>
  </div>

  <div class="card">
    <h2>Result</h2>
    <div id="status" class="muted">Nothing sent yet. OCR takes ~30-45 s per page, so a call can take a few minutes.</div>
    <pre id="result" hidden></pre>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);

  fetch("health").then(r => r.json()).then(h => {
    const parts = [`OCR server ${h.ocrServer.up ? "up" : "DOWN"}`, `LLM server ${h.llmServer.up ? "up" : "DOWN"}`];
    $("health").textContent = `${h.status} (${parts.join(", ")})`;
    $("health").className = h.status === "Healthy" ? "ok" : "bad";
  }).catch(() => { $("health").textContent = "API not reachable"; $("health").className = "bad"; });

  async function send(url) {
    const files = [...$("files").files];
    if (!files.length) { alert("Pick one or more files first."); return; }
    const form = new FormData();
    files.forEach(f => form.append("files", f, f.name));
    if ($("includeText").checked) form.append("includeText", "true");

    const buttons = document.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);
    $("result").hidden = true;
    const started = Date.now();
    const timer = setInterval(() => $("status").textContent = `Working… ${Math.round((Date.now() - started) / 1000)} s`, 1000);
    try {
      const response = await fetch(url, { method: "POST", body: form });
      const text = await response.text();
      let shown = text;
      try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch { }
      $("status").textContent = `HTTP ${response.status} after ${Math.round((Date.now() - started) / 1000)} s`;
      $("status").className = response.ok ? "ok" : "bad";
      $("result").textContent = shown;
      $("result").hidden = false;
    } catch (error) {
      $("status").textContent = `Request failed: ${error}`;
      $("status").className = "bad";
    } finally {
      clearInterval(timer);
      buttons.forEach(b => b.disabled = false);
    }
  }

  $("process").onclick = () => send("api/documents/process");
</script>
</body>
</html>
